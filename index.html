<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f3ee">
    <meta name="description" content="A personal page for Lineth Garach.">
    <title>Lineth Garach</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #202a27;
        background: #f4f3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 46rem);
        padding: clamp(2rem, 8vw, 5rem) 0;
        border-top: 3px solid #b34b37;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.75rem, 9vw, 5.5rem);
        font-weight: 400;
        line-height: 1.02;
      }

      p {
        max-width: 34rem;
        margin: 1.5rem 0 0;
        color: #59615d;
        font-family: "Avenir Next", Avenir, sans-serif;
        font-size: clamp(1rem, 3vw, 1.25rem);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lineth Garach</h1>
      <p>I am a second year BMET major and Theater minor.</p>
    </main>
  </body>
</html>
